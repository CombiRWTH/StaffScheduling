repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
        args: [--directory, api, --check]
        files: ^api/(pyproject\.toml|uv\.lock)$
      - id: uv-lock
        name: Documentation tooling lock
        args: [--directory, docs, --check]
        files: ^docs/(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: mkdocs.yml
      - id: check-yaml
        args: [--unsafe]
        files: mkdocs.yml
      - id: detect-private-key
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        files: ^api/
      - id: ruff-format
        files: ^api/
        args: [--check]
  - repo: local
    hooks:
      - id: prettier
        name: Prettier check
        entry: just format-check
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: ^(api/|webapp/pnpm-lock.yaml$)
