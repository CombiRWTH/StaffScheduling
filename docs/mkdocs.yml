site_name: Staff Scheduling
docs_dir: source
site_dir: site
site_url: https://combirwth.github.io/StaffScheduling/
repo_url: https://github.com/CombiRWTH/StaffScheduling/
repo_name: CombiRWTH/StaffScheduling

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Installation: installation.md
  - Using the app:
      - Planning workflow: usage.md
      - Current limitations: limitations.md
  - Development:
      - Codebase overview: development/overview.md
      - Code quality: development/quality.md
  - Reference:
      - API: reference/api.md
      - Domain model: reference/domain.md
      - Solver: reference/solver.md
      - TimeOffice: reference/timeoffice.md

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search:
      lang: en
