name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Hooks, types and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            docs/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: api/.python-version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webapp/package.json

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install API and documentation tools
        run: |
          uv sync --directory api --frozen
          uv sync --directory docs --frozen --python "$(cat api/.python-version)"

      - name: Install webapp dependencies
        run: pnpm --dir webapp install --frozen-lockfile

      - name: Run all Git hooks
        run: uv run --project api --frozen pre-commit run --all-files

      - name: Check API types
        working-directory: api
        run: uv run --frozen pyright .

      - name: Build documentation strictly
        working-directory: docs
        run: uv run --frozen mkdocs build --strict
