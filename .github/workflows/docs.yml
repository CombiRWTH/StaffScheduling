name: 📚 Build & Deploy Documentation
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "api/app/**"
      - "api/.python-version"
      - ".github/workflows/docs.yml"

jobs:
  build-mkdocs:
    name: 🛠️ Build & Deploy Documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: "docs/uv.lock"

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "api/.python-version"

      - name: 📦 Install Dependencies
        run: |
          uv sync --frozen --python "$(cat ../api/.python-version)"

      - name: 🚀 Build & Upload Documentation to GitHub Pages
        run: |
          uv run --frozen mkdocs build --strict
          uv run --frozen mkdocs gh-deploy --force
