name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - api/.python-version
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: publish-documentation
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated docs to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: docs/uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: api/.python-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Build documentation strictly
        run: just docs-check
      - name: Publish the checked checkout
        run: uv run --directory docs --frozen mkdocs gh-deploy --force
